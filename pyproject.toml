[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monomepybridge"
version = "0.1.0"
description = "A modern, cross-platform standalone bridge for monome grid controllers (40h, series, mext) — a drop-in replacement for legacy monomeserial with serialosc-compatible OSC."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT with Commons Clause" }
authors = [{ name = "Trumanac" }]
keywords = ["monome", "grid", "40h", "monomeserial", "serialosc", "osc", "midi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "PySide6>=6.6,<6.9",
    "python-osc>=1.8,<2.0",
    "pyserial>=3.5,<4.0",
    "python-rtmidi>=1.5,<2.0",
    "websockets>=12.0,<14.0",
    "pystray>=0.19,<0.20",
    "pillow>=10.0,<12.0",
    "platformdirs>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.2",
    "pyinstaller>=6.0,<7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/Trumanac/monomePyBridge"
Repository = "https://github.com/Trumanac/monomePyBridge"
Issues = "https://github.com/Trumanac/monomePyBridge/issues"

[project.scripts]
monomepybridge = "monomepybridge.__main__:main"

[project.gui-scripts]
monomepybridge-gui = "monomepybridge.__main__:main"

[tool.setuptools.packages.find]
include = ["monomepybridge*"]

[tool.setuptools.package-data]
monomepybridge = ["resources/*", "resources/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
