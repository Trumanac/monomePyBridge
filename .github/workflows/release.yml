name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: dist/MonomePyBridge-*.zip
          - os: macos-latest
            artifact_glob: dist/MonomePyBridge-*.zip
          - os: ubuntu-latest
            artifact_glob: dist/MonomePyBridge-*.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libasound2-dev libjack-jackd2-dev

      - name: Install package + dev extras (incl. PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build standalone bundle
        run: python scripts/build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonomePyBridge-${{ runner.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -name 'MonomePyBridge-*.zip' -exec mv {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
